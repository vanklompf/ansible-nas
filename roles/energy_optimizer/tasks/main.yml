---
- name: Start Energy Optimizer
  block:
    - name: Create Energy Optimizer data directory
      ansible.builtin.file:
        path: "{{ energy_optimizer_data_directory }}"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0750"

    - name: Ensure Homepage images directory exists
      ansible.builtin.file:
        path: "{{ homepage_images_directory }}"
        state: directory
        mode: "0755"

    - name: Install Energy Optimizer Homepage icon
      ansible.builtin.copy:
        src: energy-optimizer.svg
        dest: "{{ homepage_images_directory }}/energy-optimizer.svg"
        mode: "0644"

    - name: Validate PvOpti source checkout exists
      ansible.builtin.stat:
        path: "{{ energy_optimizer_source_directory }}/Dockerfile"
      register: energy_optimizer_source_dockerfile
      when: energy_optimizer_build_locally | bool

    - name: Fail when PvOpti source is missing
      ansible.builtin.assert:
        that:
          - energy_optimizer_source_dockerfile.stat.exists | default(false)
        fail_msg: >-
          energy_optimizer_build_locally is true but
          {{ energy_optimizer_source_directory }}/Dockerfile was not found.
          Clone vanklompf/PvOpti there or set energy_optimizer_source_directory.
      when: energy_optimizer_build_locally | bool

    - name: Validate Energy Optimizer battery control activation gates
      ansible.builtin.assert:
        that:
          - energy_optimizer_mode in ['dry_run', 'control']
          - energy_optimizer_mode != 'control' or (energy_optimizer_battery_control_enabled | bool)
          - energy_optimizer_mode != 'control' or (energy_optimizer_battery_control_watchdog_health_entity | default('') | length > 0)
          - energy_optimizer_mode != 'control' or (energy_optimizer_battery_control_watchdog_ack_entity | default('') | length > 0)
          - not (energy_optimizer_battery_control_authorize_discharge | bool) or ('DISCHARGE' in energy_optimizer_battery_control_supported_directions)
          - not (energy_optimizer_battery_export_enabled | bool) or (energy_optimizer_battery_control_authorize_discharge | bool)
        fail_msg: >-
          Unsafe PvOpti battery-control configuration. Control mode requires
          energy_optimizer_battery_control_enabled and the independent HA
          watchdog health/ack entity IDs. Discharge authorization requires
          DISCHARGE in the supported directions, and export requires discharge.

    - name: Build Energy Optimizer image from PvOpti source
      community.docker.docker_image:
        name: "{{ energy_optimizer_local_image_name }}"
        tag: "{{ energy_optimizer_local_image_version }}"
        source: build
        force_source: "{{ energy_optimizer_image_force_rebuild | bool }}"
        build:
          path: "{{ energy_optimizer_source_directory }}"
          target: runtime
          pull: "{{ energy_optimizer_build_pull | bool }}"
      when: energy_optimizer_build_locally | bool

    - name: Resolve Energy Optimizer image reference
      ansible.builtin.set_fact:
        energy_optimizer_effective_image: >-
          {{ (energy_optimizer_local_image_name ~ ':' ~ energy_optimizer_local_image_version)
             if (energy_optimizer_build_locally | bool)
             else (energy_optimizer_image_name ~ ':' ~ energy_optimizer_image_version) }}
        energy_optimizer_effective_pull: >-
          {{ false if (energy_optimizer_build_locally | bool)
             else energy_optimizer_image_pull }}

    - name: Ensure Energy Optimizer OIDC client secret is persisted on host
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/ensure_host_secret.yml"
      vars:
        _host_secret_file: "{{ energy_optimizer_oidc_client_secret_file }}"
        _host_secret_generate_cmd: openssl rand -hex 32
        _host_secret_effective_var: energy_optimizer_oidc_client_secret_effective
      when: energy_optimizer_oidc_enabled | bool

    - name: Ensure Energy Optimizer session secret is persisted on host
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/ensure_host_secret.yml"
      vars:
        _host_secret_file: "{{ energy_optimizer_session_secret_file }}"
        _host_secret_generate_cmd: openssl rand -hex 32
        _host_secret_effective_var: energy_optimizer_session_secret_effective
        _host_secret_container_name: "{{ energy_optimizer_container_name }}"
        _host_secret_container_env_key: SESSION_SECRET
      when: energy_optimizer_oidc_enabled | bool

    - name: Manage Energy Optimizer OIDC authentik blueprint
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/authentik_app_blueprint.yml"
      vars:
        _authentik_app_blueprint_enabled: "{{ energy_optimizer_oidc_enabled | bool }}"
        _authentik_app_blueprint_filename: energy-optimizer.yaml
        _authentik_app_blueprint_slug: "{{ energy_optimizer_hostname }}"
        _authentik_app_blueprint_name: "{{ energy_optimizer_oidc_display_name }}"
        _authentik_app_blueprint_client_secret: "{{ energy_optimizer_oidc_client_secret_effective | default('') }}"
        _authentik_app_blueprint_launch_url: "{{ energy_optimizer_app_url }}"
        _authentik_app_blueprint_redirect_uris:
          - "{{ energy_optimizer_app_url }}/auth/oidc/callback"

    # energy_optimizer runs before authentik in nas.yml. On a full play the
    # authentik role applies this blueprint after the worker starts. When only
    # the energy_optimizer tag is used and the worker is already up, apply here.
    - name: Check whether authentik worker is already running
      community.docker.docker_container_info:
        name: "{{ authentik_worker_container_name | default('authentik_worker') }}"
      register: energy_optimizer_authentik_worker
      failed_when: false
      when:
        - energy_optimizer_oidc_enabled | bool
        - authentik_enabled | default(false) | bool

    - name: Apply Energy Optimizer OIDC authentik blueprint
      community.docker.docker_container_exec:
        container: "{{ authentik_worker_container_name | default('authentik_worker') }}"
        command: ak apply_blueprint /blueprints/managed/energy-optimizer.yaml
      register: energy_optimizer_blueprint_apply
      changed_when: energy_optimizer_blueprint_apply.rc == 0
      until: energy_optimizer_blueprint_apply.rc == 0
      retries: 12
      delay: 10
      when:
        - energy_optimizer_oidc_enabled | bool
        - authentik_enabled | default(false) | bool
        - energy_optimizer_authentik_worker.Exists | default(false)
        - energy_optimizer_authentik_worker.container.State.Running | default(false)

    - name: Create Energy Optimizer container
      vars:
        _energy_optimizer_env_base:
          EO_MODE: "{{ energy_optimizer_mode }}"
          EO_TZ: "{{ ansible_nas_timezone }}"
          EO_HA_URL: "{{ energy_optimizer_ha_url }}"
          EO_HA_TOKEN: "{{ energy_optimizer_ha_token }}"
          EO_PSTRYK_API_KEY: "{{ energy_optimizer_pstryk_api_key }}"
          EO_BATTERY_SOC_MIN_PCT: "{{ energy_optimizer_battery_soc_min_pct }}"
          EO_BATTERY_HARD_SOC_MIN_PCT: "{{ energy_optimizer_battery_hard_soc_min_pct }}"
          EO_MQTT_HOST: "{{ mosquitto_container_name }}"
          EO_MQTT_PORT: "1883"
          EO_MQTT_USERNAME: "{{ mqtt_user }}"
          EO_MQTT_PASSWORD: "{{ mqtt_password }}"
          EO_EV_CONTROL_ENABLED: "{{ energy_optimizer_ev_control_enabled | string | lower }}"
          EO_EV_SWITCH_ENTITY: "{{ energy_optimizer_ev_switch_entity | default(omit, true) }}"
          EO_EV_POWER_ENTITY: "{{ energy_optimizer_ev_power_entity | default(omit, true) }}"
          EO_EV_SOC_ENTITY: "{{ energy_optimizer_ev_soc_entity | default(omit, true) }}"
          EO_EV_CHARGING_STATUS_ENTITY: "{{ energy_optimizer_ev_charging_status_entity | default(omit, true) }}"
          EO_EV_CHARGING_ACTIVE_ENTITY: "{{ energy_optimizer_ev_charging_active_entity | default(omit, true) }}"
          EO_EV_CHARGE_TO_100_ENTITY: "{{ energy_optimizer_ev_charge_to_100_entity | default(omit, true) }}"
          EO_EV_FAULT_ENTITIES: "{{ energy_optimizer_ev_fault_entities | default(omit, true) }}"
          EO_EV_MINIMUM_TARGET_SOC_PCT: "{{ energy_optimizer_ev_minimum_target_soc_pct | default(omit, true) }}"
          EO_EV_DEPARTURE_HOUR: "{{ energy_optimizer_ev_departure_hour | default(omit, true) }}"
          EO_EV_MIN_ON_MINUTES: "{{ energy_optimizer_ev_min_on_minutes | default(omit, true) }}"
          EO_EV_MIN_OFF_MINUTES: "{{ energy_optimizer_ev_min_off_minutes | default(omit, true) }}"
          EO_EV_RELAY_SETTLE_SECONDS: "{{ energy_optimizer_ev_relay_settle_seconds | default(omit, true) }}"
          EO_EV_RELAY_VERIFY_INTERVAL_SECONDS: "{{ energy_optimizer_ev_relay_verify_interval_seconds | default(omit, true) }}"
          EO_EV_RELAY_VERIFY_TIMEOUT_SECONDS: "{{ energy_optimizer_ev_relay_verify_timeout_seconds | default(omit, true) }}"
          EO_EV_RELAY_FAILURE_BACKOFF_MINUTES: "{{ energy_optimizer_ev_relay_failure_backoff_minutes | default(omit, true) }}"
          EO_EV_FORECAST_SURPLUS_FACTOR: "{{ energy_optimizer_ev_forecast_surplus_factor | default(omit, true) }}"
          EO_EV_BATTERY_FULL_SOC_PCT: "{{ energy_optimizer_ev_battery_full_soc_pct | default(omit, true) }}"
          EO_BATTERY_CONTROL_ENABLED: "{{ energy_optimizer_battery_control_enabled | string | lower }}"
          EO_BATTERY_EXPORT_ENABLED: "{{ energy_optimizer_battery_export_enabled | string | lower }}"
          EO_BATTERY_CONTROL_GRID_CHARGE_ENABLED: "{{ energy_optimizer_battery_control_grid_charge_enabled | string | lower }}"
          EO_BATTERY_CONTROL_AUTHORIZE_DISCHARGE: "{{ energy_optimizer_battery_control_authorize_discharge | string | lower }}"
          EO_BATTERY_CONTROL_SUPPORTED_DIRECTIONS: "{{ energy_optimizer_battery_control_supported_directions }}"
          EO_BATTERY_CONTROL_DISCHARGE_COMMAND_MODE: "{{ energy_optimizer_battery_control_discharge_command_mode | default(omit, true) }}"
          EO_BATTERY_CONTROL_EXPORT_COMMAND_MODE: "{{ energy_optimizer_battery_control_export_command_mode | default(omit, true) }}"
          EO_BATTERY_CONTROL_MIN_SOC_PCT: "{{ energy_optimizer_battery_control_min_soc_pct | default(omit, true) }}"
          EO_BATTERY_CONTROL_WATCHDOG_HEALTH_ENTITY: "{{ energy_optimizer_battery_control_watchdog_health_entity | default(omit, true) }}"
          EO_BATTERY_CONTROL_WATCHDOG_ACK_ENTITY: "{{ energy_optimizer_battery_control_watchdog_ack_entity | default(omit, true) }}"
          EO_PV_LAT: "{{ energy_optimizer_pv_lat | string }}"
          EO_PV_LON: "{{ energy_optimizer_pv_lon | string }}"
          EO_PV_PLANES: "{{ energy_optimizer_pv_planes }}"
          OIDC_ENABLED: "false"
        _energy_optimizer_env_oidc:
          OIDC_ENABLED: "true"
          OIDC_CLIENT_ID: "{{ energy_optimizer_hostname }}"
          OIDC_CLIENT_SECRET: "{{ energy_optimizer_oidc_client_secret_effective | default('') }}"
          OIDC_ISSUER_URL: "{{ energy_optimizer_oidc_issuer_url }}"
          APP_URL: "{{ energy_optimizer_app_url }}"
          SESSION_SECRET: "{{ energy_optimizer_session_secret_effective | default('') }}"
          OIDC_AUTO_LOGIN: "{{ 'true' if energy_optimizer_oidc_auto_login | bool else 'false' }}"
          OIDC_SCOPES: "openid email profile"
      community.docker.docker_container:
        name: "{{ energy_optimizer_container_name }}"
        image: "{{ energy_optimizer_effective_image }}"
        state: started
        pull: "{{ energy_optimizer_effective_pull }}"
        volumes:
          - "{{ energy_optimizer_data_directory }}:/data:rw"
        network_mode: "{{ homeassistant_network_name }}"
        ports:
          - "{{ energy_optimizer_port }}:8320"
        env: "{{ _energy_optimizer_env_base | combine(_energy_optimizer_env_oidc if energy_optimizer_oidc_enabled | bool else {}) }}"
        restart_policy: unless-stopped
        memory: "{{ energy_optimizer_memory }}"
        labels:
          traefik.enable: "{{ energy_optimizer_available_externally | string }}"
          traefik.http.routers.energy-optimizer.rule: "Host(`{{ energy_optimizer_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.energy-optimizer.tls.certresolver: letsencrypt
          traefik.http.routers.energy-optimizer.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.energy-optimizer.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.energy-optimizer.loadbalancer.server.port: "8320"
          homepage.group: Home
          homepage.weight: "60"
          homepage.name: Energy Optimizer
          homepage.icon: /images/energy-optimizer.svg
          homepage.href: "https://{{ energy_optimizer_hostname }}.{{ ansible_nas_domain }}"
          homepage.description: Solar and battery optimisation
        healthcheck:
          test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8320/healthz').status==200 else 1)"]
          interval: 30s
          retries: 3
          start_period: 20s
          timeout: 5s
      no_log: true
  when: energy_optimizer_enabled | bool

- name: Stop Energy Optimizer
  block:
    - name: Stop Energy Optimizer container
      community.docker.docker_container:
        name: "{{ energy_optimizer_container_name }}"
        state: absent

    - name: Remove Energy Optimizer OIDC authentik blueprint
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/authentik_app_blueprint.yml"
      vars:
        _authentik_app_blueprint_enabled: false
        _authentik_app_blueprint_filename: energy-optimizer.yaml
  when: not (energy_optimizer_enabled | bool)
