---
- name: Start Steam
  when: steam_enabled | bool
  block:
    - name: Validate Steam configuration
      ansible.builtin.assert:
        that:
          - steam_image_digest is match('^sha256:[0-9a-f]{64}$')
          - steam_password | length > 0
          - steam_gpu_vendor in ['amd', 'intel']
          - steam_gpu_devices | length > 0
          - steam_mode in ['primary', 'secondary']
          - steam_web_ui_mode in ['vnc', 'neko', 'none']
          - steam_web_ui_port is match('^[0-9]+$')
          - steam_web_ui_port | int >= 1024
          - steam_web_ui_port | int <= 65535
          - steam_host_network_acknowledged | bool
        fail_msg: >-
          Steam requires a pinned image digest, a private UI password,
          valid session settings, an explicit GPU configuration, and acknowledgement
          that host networking exposes services on every host interface.

    - name: Create Steam directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ steam_user_id }}"
        group: "{{ steam_group_id }}"
        mode: "0750"
      loop:
        - "{{ steam_home_directory }}"
        - "{{ steam_games_directory }}"
        - "{{ steam_sockets_directory }}"
        - "{{ steam_sockets_directory }}/.X11-unix"
        - "{{ steam_sockets_directory }}/pulse"

    - name: Check Steam host devices
      ansible.builtin.stat:
        path: "{{ item.split(':')[0] }}"
      loop: "{{ steam_base_devices + steam_gpu_devices }}"
      register: steam_device_status

    - name: Validate Steam host devices
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.ischr | default(false)
        fail_msg: "Required character device {{ item.item.split(':')[0] }} is unavailable."
      loop: "{{ steam_device_status.results }}"

    - name: Check existing Steam container
      community.docker.docker_container_info:
        name: "{{ steam_container_name }}"
      register: steam_container_info

    - name: Check Steam host ports
      ansible.builtin.command:
        argv:
          - ss
          - -H
          - -lntu
          - "sport = :{{ item }}"
      loop: "{{ steam_required_host_ports }}"
      register: steam_port_checks
      changed_when: false
      check_mode: false
      when: >-
        not steam_container_info.exists or
        not (steam_container_info.container.State.Running | default(false))

    - name: Validate Steam host ports
      ansible.builtin.assert:
        that:
          - >-
            steam_port_checks.results
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'ne', '')
            | list
            | length == 0
        fail_msg: >-
          At least one Steam, Sunshine, noVNC, or Steam Remote Play port
          is already in use. Review the port-check results before enabling the service.
      when: >-
        not steam_container_info.exists or
        not (steam_container_info.container.State.Running | default(false))

    - name: Install Steam /dev/shm cleanup script
      ansible.builtin.template:
        src: steam-shm-cleanup.sh.j2
        dest: "{{ steam_shm_cleanup_script_path }}"
        owner: root
        group: root
        mode: "0755"
      when: steam_shm_cleanup_enabled | bool

    - name: Schedule Steam /dev/shm cleanup
      ansible.builtin.cron:
        name: steam /dev/shm orphan cleanup
        minute: "0"
        hour: "2"
        user: root
        job: "{{ steam_shm_cleanup_script_path }}"
      when: steam_shm_cleanup_enabled | bool

    - name: Remove Steam /dev/shm cleanup schedule
      ansible.builtin.cron:
        name: steam /dev/shm orphan cleanup
        user: root
        state: absent
      when: not (steam_shm_cleanup_enabled | bool)

    - name: Remove Steam /dev/shm cleanup script
      ansible.builtin.file:
        path: "{{ steam_shm_cleanup_script_path }}"
        state: absent
      when: not (steam_shm_cleanup_enabled | bool)

    - name: Clean unused Steam /dev/shm orphans before start
      ansible.builtin.command:
        argv:
          - "{{ steam_shm_cleanup_script_path }}"
      register: steam_shm_cleanup_before_start
      changed_when: >-
        (steam_shm_cleanup_before_start.stdout | default('')) is search('deleted=[1-9]')
      when: steam_shm_cleanup_enabled | bool

    - name: Install Steam udev overlay script
      ansible.builtin.template:
        src: steam-start-dumb-udev.sh.j2
        dest: "{{ steam_udev_script_path }}"
        owner: root
        group: root
        mode: "0755"
      register: steam_udev_script
      when: not (steam_udev_xorg_restart_enabled | bool)

    - name: Remove Steam udev overlay when restoring upstream script
      ansible.builtin.file:
        path: "{{ steam_udev_script_path }}"
        state: absent
      when: steam_udev_xorg_restart_enabled | bool

    - name: Create Steam Docker container
      community.docker.docker_container:
        container_default_behavior: no_defaults
        name: "{{ steam_container_name }}"
        hostname: "{{ steam_hostname }}"
        image: "{{ steam_image_name }}@{{ steam_image_digest }}"
        pull: missing
        state: started
        recreate: "{{ steam_udev_script.changed | default(false) }}"
        restart_policy: unless-stopped
        network_mode: host
        ipc_mode: host
        etc_hosts:
          "{{ steam_hostname }}": 127.0.0.1
        shm_size: "{{ steam_shm_size }}"
        memory: "{{ steam_memory }}"
        ulimits: "{{ steam_ulimits }}"
        capabilities: "{{ steam_capabilities }}"
        security_opts: "{{ steam_security_opts }}"
        devices: "{{ steam_base_devices + steam_gpu_devices }}"
        device_cgroup_rules: "{{ steam_device_cgroup_rules }}"
        volumes: "{{ steam_container_volumes + ((steam_udev_xorg_restart_enabled | bool) | ternary([], steam_udev_overlay_volumes)) }}"
        env: "{{ steam_env }}"
        labels:
          traefik.enable: "false"
          homepage.group: Applications
          homepage.weight: "10"
          homepage.name: Steam
          homepage.icon: steam
          homepage.href: "http://{{ ansible_nas_ip }}:{{ steam_web_ui_port }}"
          homepage.description: Steam desktop on trusted LAN (noVNC)
      no_log: true

- name: Stop Steam
  when: not (steam_enabled | bool)
  block:
    - name: Stop Steam Docker container
      community.docker.docker_container:
        name: "{{ steam_container_name }}"
        state: absent

    - name: Remove Steam /dev/shm cleanup schedule
      ansible.builtin.cron:
        name: steam /dev/shm orphan cleanup
        user: root
        state: absent

    - name: Clean unused Steam /dev/shm orphans after stop
      ansible.builtin.command:
        argv:
          - "{{ steam_shm_cleanup_script_path }}"
      register: steam_shm_cleanup_after_stop
      changed_when: >-
        (steam_shm_cleanup_after_stop.stdout | default('')) is search('deleted=[1-9]')
      failed_when: false
      when: steam_shm_cleanup_enabled | bool

    - name: Remove leftover Steam udev overlay script
      ansible.builtin.file:
        path: "{{ steam_udev_script_path }}"
        state: absent

    - name: Remove Steam /dev/shm cleanup script
      ansible.builtin.file:
        path: "{{ steam_shm_cleanup_script_path }}"
        state: absent
